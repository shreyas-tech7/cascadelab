<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Accuracy against cost per 1,000 tasks</title>
<desc id="d">Held-out split, 72 tasks. Models: `fake-cheap` (priced as llama-3.1-8b-instant on Groq) and `fake-strong` (priced as llama-3.3-70b-versatile on Groq). Fixtures `fake-seed0` recorded 2026-11-23 by the fake provider, fake seed 0. Price table checked 2026-11-23. Agreement cascade k = 5. Router embedder `hash-512`. Bootstrap 2000 resamples, seed 0.</desc>
<style>
.bg{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.grid{stroke:#e4e3df;stroke-width:1}.axis{stroke:#9a9993;stroke-width:1}.ci{stroke-width:2;stroke-linecap:round}.ring{stroke:#fcfcfb;stroke-width:2}
.s-cheap_only{fill:#2a78d6;stroke:#2a78d6}.s-strong_only{fill:#eb6834;stroke:#eb6834}.s-cascade_check{fill:#1baf7a;stroke:#1baf7a}.s-cascade_agree{fill:#eda100;stroke:#eda100}.s-learned_router{fill:#e87ba4;stroke:#e87ba4}.s-oracle_router{fill:#6250d6;stroke:#6250d6}
@media (prefers-color-scheme: dark){.bg{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}.grid{stroke:#383835}.axis{stroke:#6b6a64}.ring{stroke:#1a1a19}.s-cheap_only{fill:#3987e5;stroke:#3987e5}.s-strong_only{fill:#d95926;stroke:#d95926}.s-cascade_check{fill:#199e70;stroke:#199e70}.s-cascade_agree{fill:#c98500;stroke:#c98500}.s-learned_router{fill:#d55181;stroke:#d55181}.s-oracle_router{fill:#9085e9;stroke:#9085e9}}
</style>
<rect class="bg" width="760" height="460" rx="8"/>
<line class="grid" x1="70" x2="560" y1="400.0" y2="400.0"/>
<text class="ink2" x="62" y="404.0" font-size="12" text-anchor="end">50.0%</text>
<line class="grid" x1="70" x2="560" y1="326.0" y2="326.0"/>
<text class="ink2" x="62" y="330.0" font-size="12" text-anchor="end">60.0%</text>
<line class="grid" x1="70" x2="560" y1="252.0" y2="252.0"/>
<text class="ink2" x="62" y="256.0" font-size="12" text-anchor="end">70.0%</text>
<line class="grid" x1="70" x2="560" y1="178.0" y2="178.0"/>
<text class="ink2" x="62" y="182.0" font-size="12" text-anchor="end">80.0%</text>
<line class="grid" x1="70" x2="560" y1="104.0" y2="104.0"/>
<text class="ink2" x="62" y="108.0" font-size="12" text-anchor="end">90.0%</text>
<line class="grid" x1="70" x2="560" y1="30.0" y2="30.0"/>
<text class="ink2" x="62" y="34.0" font-size="12" text-anchor="end">100.0%</text>
<line class="axis" x1="70.0" x2="70.0" y1="400" y2="405"/>
<text class="ink2" x="70.0" y="420" font-size="12" text-anchor="middle">$0.00</text>
<line class="axis" x1="192.5" x2="192.5" y1="400" y2="405"/>
<text class="ink2" x="192.5" y="420" font-size="12" text-anchor="middle">$0.02</text>
<line class="axis" x1="315.0" x2="315.0" y1="400" y2="405"/>
<text class="ink2" x="315.0" y="420" font-size="12" text-anchor="middle">$0.04</text>
<line class="axis" x1="437.5" x2="437.5" y1="400" y2="405"/>
<text class="ink2" x="437.5" y="420" font-size="12" text-anchor="middle">$0.06</text>
<line class="axis" x1="560.0" x2="560.0" y1="400" y2="405"/>
<text class="ink2" x="560.0" y="420" font-size="12" text-anchor="middle">$0.08</text>
<line class="axis" x1="70" x2="560" y1="400" y2="400"/>
<text class="ink" x="315.0" y="446" font-size="13" text-anchor="middle">Cost per 1,000 tasks (USD, dated list prices, comparison only)</text>
<text class="ink" x="16" y="215.0" font-size="13" text-anchor="middle" transform="rotate(-90 16 215.0)">Accuracy, held-out (95% CI)</text>
<g class="s-cheap_only" data-strategy="cheap_only"><title>Cheap model only: accuracy 73.6% (62.4% to 82.4%), $0.0059 per 1,000 tasks, escalation 0.0%</title>
<line class="ci s-cheap_only" x1="106.1" x2="106.1" y1="308.1" y2="160.2"/>
<circle class="ring s-cheap_only" cx="106.1" cy="225.3" r="6"/>
</g>
<rect class="s-cheap_only" x="578" y="35" width="12" height="12" rx="3"/>
<text class="ink" x="596" y="45" font-size="12">Cheap model only</text>
<g class="s-strong_only" data-strategy="strong_only"><title>Strong model only: accuracy 94.4% (86.6% to 97.8%), $0.0662 per 1,000 tasks, escalation 0.0%</title>
<line class="ci s-strong_only" x1="475.5" x2="475.5" y1="129.4" y2="46.1"/>
<rect class="ring s-strong_only" x="469.5" y="65.1" width="12" height="12" rx="2"/>
</g>
<rect class="s-strong_only" x="578" y="57" width="12" height="12" rx="3"/>
<text class="ink" x="596" y="67" font-size="12">Strong model only</text>
<g class="s-cascade_check" data-strategy="cascade_check"><title>Cascade on visible check: accuracy 84.7% (74.7% to 91.2%), $0.0148 per 1,000 tasks, escalation 12.5%</title>
<line class="ci s-cascade_check" x1="160.7" x2="160.7" y1="217.4" y2="94.8"/>
<path class="ring s-cascade_check" d="M160.7 135.1L168.7 143.1L160.7 151.1L152.7 143.1Z"/>
</g>
<rect class="s-cascade_check" x="578" y="79" width="12" height="12" rx="3"/>
<text class="ink" x="596" y="89" font-size="12">Cascade on visible check</text>
<g class="s-cascade_agree" data-strategy="cascade_agree"><title>Cascade on agreement (k=5): accuracy 97.2% (90.4% to 99.2%), $0.0738 per 1,000 tasks, escalation 68.1%</title>
<line class="ci s-cascade_agree" x1="522.0" x2="522.0" y1="100.8" y2="35.7"/>
<path class="ring s-cascade_agree" d="M522.0 42.6L530.0 56.6L514.0 56.6Z"/>
</g>
<rect class="s-cascade_agree" x="578" y="101" width="12" height="12" rx="3"/>
<text class="ink" x="596" y="111" font-size="12">Cascade on agreement (k=5)</text>
<g class="s-learned_router" data-strategy="learned_router"><title>Learned router: accuracy 79.2% (68.4% to 86.9%), $0.0268 per 1,000 tasks, escalation 33.3%</title>
<line class="ci s-learned_router" x1="234.3" x2="234.3" y1="263.6" y2="126.6"/>
<circle class="ring s-learned_router" cx="234.3" cy="184.2" r="6"/>
</g>
<rect class="s-learned_router" x="578" y="123" width="12" height="12" rx="3"/>
<text class="ink" x="596" y="133" font-size="12">Learned router</text>
<g class="s-oracle_router" data-strategy="oracle_router"><title>Oracle router (upper bound): accuracy 98.6% (92.5% to 99.8%), $0.0218 per 1,000 tasks, escalation 26.4%</title>
<line class="ci s-oracle_router" x1="203.6" x2="203.6" y1="85.2" y2="31.8"/>
<rect class="ring s-oracle_router" x="197.6" y="34.3" width="12" height="12" rx="2"/>
</g>
<rect class="s-oracle_router" x="578" y="145" width="12" height="12" rx="3"/>
<text class="ink" x="596" y="155" font-size="12">Oracle router (upper bound)</text>
</svg>
